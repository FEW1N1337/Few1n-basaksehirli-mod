name: Build FEW1N Basaksehirli Tweak (.dylib)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FEW1N Basaksehirli Tweak
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache iOS SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/sdks
          key: ios-sdks-ubuntu-v1

      - name: Setup iOS SDK & Tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ld64.lld >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang lld
          fi
          if [ ! -d "${{ github.workspace }}/sdks" ] || [ -z "$(ls -A "${{ github.workspace }}/sdks" 2>/dev/null || true)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            mkdir -p "${{ github.workspace }}/sdks"
            cp -R "$RUNNER_TEMP/theos-sdks"/iPhoneOS*.sdk "${{ github.workspace }}/sdks/"
          fi
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid
          chmod +x /tmp/ldid

      - name: Build Tweak (.dylib)
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(ls -d "${{ github.workspace }}/sdks"/iPhoneOS*.sdk | sort -V | tail -n 1)
          echo "Using SDK: $SDK"
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -fuse-ld=lld \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -Wno-unused-function \
            -F"$SDK/System/Library/Frameworks" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @rpath/FEW1NBasaksehirli.dylib \
            FEW1NBasaksehirli.m \
            -o FEW1NBasaksehirli.dylib
          /tmp/ldid -S FEW1NBasaksehirli.dylib
          file ./FEW1NBasaksehirli.dylib
          ls -lh ./FEW1NBasaksehirli.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FEW1NBasaksehirli-Dylib
          path: ./FEW1NBasaksehirli.dylib
